<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body>
    <a-scene cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .raycastable" >
        <a-sphere scale="1 0.1 0.5" position=" 0 0 0" radius="4" color="#EBE381"></a-sphere>
        <a-sphere scale="1 0.2 0.5" position=" 0 0 0" radius="3" color="#EBE381"></a-sphere>
        <a-sphere shadow="receive: false" position=" 100 100 -100" radius="15" color="#FFF000" zon></a-sphere>
        <a-plane roughness="0" position="0 0 -4" rotation="-90 0 0" width="100" height="100" color="#0E95ED"></a-plane>


    <a-entity rotation="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear">
        <a-box position="8.01 0.30 0" height="1" width="1" color="" rotation=" 45 0 0" src="textures/wood_light.jpg"></a-box>
        <a-box position="8 0.5 0.5" height="1" width="1" color="" rotation=" 0 0 0" src="textures/wood_light.jpg"></a-box>
        <a-box position="8.01 0.30 1" height="1" width="1" color="" rotation=" 45 0 0" src="textures/wood_light.jpg"></a-box>
        
        <a-cylinder position="8 1 0.5" height="4" radius="0.1" src="textures/wood_dark.jpg"></a-cylinder>
        <a-triangle position="8 3 0.5" rotation="0 -90 0" scale="4 2 4" src="textures/wool.png"></a-triangle>
    </a-entity>

        <a-sky color="#ABF7F7"></a-sky>
    </a-scene> 
</body>
</html>
